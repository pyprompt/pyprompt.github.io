<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyPrompt</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <div id="missing" hidden>
    <h1>Page not found</h1>
    <p class="tagline">That page doesn't exist.</p>
    <p>Try the <a href="/">home page</a>, <a href="/support/">support</a>, or the
    <a href="/privacy/">privacy policy</a>.</p>
  </div>

  <footer>
    <nav>
      <a href="/">Home</a>
      <a href="/support/">Support</a>
      <a href="/privacy/">Privacy Policy</a>
    </nav>
    <p>© 2026 Tibor Felföldy</p>
  </footer>
</main>

<script>
  // A shared session lives at /shared/<id>, which is not a real file — Pages has
  // no rewrite rules, so the request lands here whenever the app did not claim
  // the link. Hand it to /shared/, which is a real page and answers 200, rather
  // than showing session content under a 404. replace() keeps the dead URL out
  // of history so Back returns where the visitor came from.
  (function () {
    var match = location.pathname.match(/^\/shared\/([^/?#]+)\/?$/);
    if (match) {
      location.replace("/shared/?id=" + encodeURIComponent(decodeURIComponent(match[1])));
      return;
    }
    document.getElementById("missing").hidden = false;
  })();
</script>
</body>
</html>
